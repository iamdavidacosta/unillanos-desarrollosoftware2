<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
  @for (author of authors(); track author.key) {
    <div class="bg-white rounded-lg shadow p-4">
      <h3 class="text-lg font-bold mb-2">{{ author.name }}</h3>
      
      @if (author.top_work) {
        <p class="text-gray-700 mb-1">
          <strong>Obra principal:</strong> {{ author.top_work }}
        </p>
      }
      
      @if (author.work_count) {
        <p class="text-gray-600 mb-1">
          <strong>Número de obras:</strong> {{ author.work_count }}
        </p>
      }
      
      <p class="text-sm text-gray-500">
        <strong>ID:</strong> {{ author.key }}
      </p>
    </div>
  }
</div>
