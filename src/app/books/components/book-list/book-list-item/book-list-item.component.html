<div class="bg-white rounded-lg shadow-md p-4 hover:shadow-lg transition-shadow">
  @if (book().cover_url) {
    <img [src]="book().cover_url" [alt]="book().title" class="w-full h-48 object-cover rounded-md mb-3">
  } @else {
    <div class="w-full h-48 bg-gray-200 rounded-md mb-3 flex items-center justify-center">
      <span class="text-gray-500">Sin portada</span>
    </div>
  }
  <h3 class="text-lg font-semibold mb-2 line-clamp-2">{{ book().title }}</h3>
  <p class="text-gray-600 text-sm mb-1">{{ book().author }}</p>
  @if (book().first_publish_year) {
    <p class="text-gray-500 text-xs mb-2">{{ book().first_publish_year }}</p>
  }
  <p class="text-blue-600 text-xs font-mono bg-blue-50 p-1 rounded">
    <strong>ID:</strong> {{ book().id }}
  </p>
</div>
