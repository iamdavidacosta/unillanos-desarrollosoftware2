<div class="container mx-auto p-4">
  <h1 class="text-3xl font-bold mb-4">Buscar Autores</h1>
  <div class="flex gap-2 mb-6">
    <input type="text" [(ngModel)]="searchTerm" placeholder="Buscar autores..." class="flex-1 px-4 py-2 border rounded-lg">
    <button (click)="onSearch()" class="px-6 py-2 bg-blue-500 text-white rounded-lg">Buscar</button>
  </div>
  @if (authorResults().length > 0) {
    <h2 class="text-xl font-bold mb-4">Autores encontrados ({{ authorResults().length }})</h2>
    <author-list [authors]="authorResults()" />
  } @else {
    <p class="text-gray-500">Busca autores escribiendo en el campo de arriba</p>
  }
</div>
