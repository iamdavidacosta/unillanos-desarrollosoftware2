<div class="container mx-auto p-4">
  
  <!-- Formulario de búsqueda -->
  <h1 class="text-3xl font-bold mb-4">Buscar Libros</h1>
  
  <div class="flex gap-2 mb-6">
    <input 
      type="text" 
      [(ngModel)]="searchTerm"
      placeholder="Buscar libros..."
      class="flex-1 px-4 py-2 border rounded-lg"
    >
    <button 
      (click)="onSearch()"
      class="px-6 py-2 bg-blue-500 text-white rounded-lg"
    >
      Buscar
    </button>
  </div>

  <!-- Resultados de búsqueda -->
  @if (searchResults().length > 0) {
    <h2 class="text-xl font-bold mb-4">Libros encontrados ({{ searchResults().length }})</h2>
    <book-list [books]="searchResults()" />
  } @else {
    <p class="text-gray-500">Busca libros escribiendo en el campo de arriba</p>
  }

</div>
