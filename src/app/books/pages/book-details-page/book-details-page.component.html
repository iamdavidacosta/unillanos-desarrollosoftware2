<div class="container mx-auto p-4">
  <h1 class="text-3xl font-bold mb-4">Detalles de Libro</h1>
  <div class="flex gap-2 mb-4">
    <input type="text" [(ngModel)]="bookId" placeholder="ID del libro (ej: /works/OL45804W)" class="flex-1 px-4 py-2 border rounded-lg">
    <button (click)="getBookDetails()" class="px-6 py-2 bg-blue-500 text-white rounded-lg">Buscar</button>
  </div>
  @if (bookDetails()) {
    <div class="bg-white rounded-lg shadow p-6 mt-6">
      <div class="flex flex-col md:flex-row gap-6">
        @if (bookDetails().covers && bookDetails().covers[0]) {
          <img [src]="'https://covers.openlibrary.org/b/id/' + bookDetails().covers[0] + '-L.jpg'" 
               [alt]="bookDetails().title" 
               class="w-full md:w-64 h-80 object-cover rounded-lg">
        } @else {
          <div class="w-full md:w-64 h-80 bg-gray-200 rounded-lg flex items-center justify-center">
            <span class="text-gray-500">Sin portada</span>
          </div>
        }
        <div class="flex-1">
          <h2 class="text-2xl font-bold mb-4">{{ bookDetails().title }}</h2>
          <p class="text-gray-700 mt-2">{{ bookDetails().description?.value || bookDetails().description || "Sin descripción" }}</p>
        </div>
      </div>
    </div>
  } @else {
    <p class="text-gray-500 mt-6">Ingresa un ID de libro para ver sus detalles</p>
  }
</div>
