<div class="container mx-auto p-4">
  
  <!-- Formulario de búsqueda -->
  <div class="search-section mb-6">
    <h1 class="text-3xl font-bold mb-4">Buscar GIFs</h1>
    
    <div class="flex gap-2 mb-4">
      <input 
        type="text" 
        [(ngModel)]="searchTerm"
        (keyup.enter)="onSearch()"
        placeholder="Buscar GIFs..."
        class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
      >
      <button 
        (click)="onSearch()"
        [disabled]="!searchTerm.trim()"
        class="px-6 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 disabled:bg-gray-300 disabled:cursor-not-allowed transition-colors"
      >
        Buscar
      </button>
    </div>
  </div>

  <!-- Resultados de búsqueda -->
  <div class="results-section">
    @if (searchResults().length > 0) {
      <h2 class="text-2xl font-semibold mb-4">
        Resultados ({{ searchResults().length }})
      </h2>
      <gif-list [gifs]="searchResults()" />
    } @else if (searchTerm && searchResults().length === 0) {
      <div class="text-center py-8">
        <p class="text-gray-500 text-lg">No se encontraron resultados para "{{ searchTerm }}"</p>
      </div>
    } @else {
      <div class="text-center py-8">
        <p class="text-gray-500 text-lg">Busca GIFs escribiendo en el campo de arriba</p>
      </div>
    }
  </div>

</div>
